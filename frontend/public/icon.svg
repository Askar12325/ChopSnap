<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="potGradSq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263982" />
      <stop offset="100%" stop-color="#1D2B64" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#121A3F" stroke="#F9A826" stroke-width="1.5" />

  <!-- Cooking Pot & Saffron Spark/Aperture -->
  <g transform="translate(6, 6)">
    <!-- Pot Side Handles -->
    <path d="M7 27 C4 27 3.5 32 7 32" stroke="#FFF5E1" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M45 27 C48 27 48.5 32 45 32" stroke="#FFF5E1" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Pot Body -->
    <path d="M10 24 L11.5 36 C12.5 42.5 17 46 26 46 C35 46 39.5 42.5 40.5 36 L42 24 Z" fill="#1D2B64" stroke="#FFF5E1" stroke-width="1.6" />

    <!-- Pot Rim -->
    <rect x="8" y="22" width="36" height="4" rx="2" fill="#263982" stroke="#FFF5E1" stroke-width="1" />

    <!-- Domed Pot Lid -->
    <path d="M11 22 C13 14 39 14 41 22 Z" fill="#1D2B64" stroke="#FFF5E1" stroke-width="1.4" />

    <!-- Lid Knob -->
    <ellipse cx="26" cy="14" rx="4.5" ry="2.4" fill="#F9A826" />

    <!-- Aperture / Spark Mark on Lid -->
    <circle cx="26" cy="18.5" r="4.8" fill="#121A3F" stroke="#F9A826" stroke-width="1.6" />
    <circle cx="26" cy="18.5" r="1.8" fill="#F9A826" />
    <line x1="26" y1="13.2" x2="26" y2="15.2" stroke="#F9A826" stroke-width="1.2" stroke-linecap="round" />
    <line x1="26" y1="21.8" x2="26" y2="23.8" stroke="#F9A826" stroke-width="1.2" stroke-linecap="round" />
    <line x1="20.7" y1="18.5" x2="22.7" y2="18.5" stroke="#F9A826" stroke-width="1.2" stroke-linecap="round" />
    <line x1="29.3" y1="18.5" x2="31.3" y2="18.5" stroke="#F9A826" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>