<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-chop {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 32px;
        letter-spacing: -0.02em;
        fill: #1D2B64;
      }
      .brand-snap {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 32px;
        letter-spacing: -0.02em;
        fill: #B36B00;
      }
      .pot-color {
        fill: #1D2B64;
      }
      .pot-stroke {
        stroke: #1D2B64;
      }
      :root.dark .brand-chop {
        fill: #FFF5E1;
      }
      :root.dark .brand-snap {
        fill: #F9A826;
      }
      :root.dark .pot-color {
        fill: #FFF5E1;
      }
      :root.dark .pot-stroke {
        stroke: #FFF5E1;
      }
    </style>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Cooking Pot & Saffron Spark/Aperture -->
  <g transform="translate(4, 4)" filter="url(#subtleShadow)">
    <!-- Pot Side Handles -->
    <path d="M6 23 C4 23 3.5 27 6 27" class="pot-stroke" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M38 23 C40 23 40.5 27 38 27" class="pot-stroke" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Pot Body -->
    <path d="M9 20 L10.5 32 C11.2 37 15 40 22 40 C29 40 32.8 37 33.5 32 L35 20 Z" class="pot-color" />

    <!-- Pot Rim -->
    <rect x="7.5" y="18" width="29" height="3.5" rx="1.75" class="pot-color" />

    <!-- Domed Pot Lid -->
    <path d="M10 18 C12 11 32 11 34 18 Z" class="pot-color" opacity="0.88" />

    <!-- Lid Knob -->
    <ellipse cx="22" cy="11" rx="4" ry="2" fill="#F9A826" />

    <!-- Aperture / Spark on Lid -->
    <circle cx="22" cy="15" r="3.2" fill="#F9A826" />
    <circle cx="22" cy="15" r="1.4" fill="#1D2B64" />
    <line x1="22" y1="11" x2="22" y2="12.2" stroke="#F9A826" stroke-width="1.2" stroke-linecap="round" />
    <line x1="22" y1="17.8" x2="22" y2="19" stroke="#F9A826" stroke-width="1.2" stroke-linecap="round" />
    <line x1="18.5" y1="15" x2="19.7" y2="15" stroke="#F9A826" stroke-width="1.2" stroke-linecap="round" />
    <line x1="24.3" y1="15" x2="25.5" y2="15" stroke="#F9A826" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Wordmark "ChopSnap" -->
  <text x="56" y="36">
    <tspan class="brand-chop">Chop</tspan><tspan class="brand-snap">Snap</tspan>
  </text>
</svg>